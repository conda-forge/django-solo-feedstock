# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-solo
  version: 2.6.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 0c7093d5e9c8a8b93c4383f4a4bbbe06bf9efd833ca55b8c035c9f878b6a9c30

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }},<4.0
    - django >=5.2
tests:
  - python:
      imports:
        - solo
      python_version: ${{ python_min }}.*
      pip_check: true

about:
  summary: Django Solo helps working with singletons
  license: CC-BY-3.0
  license_file: LICENSE
  homepage: https://github.com/lazybird/django-solo/

extra:
  recipe-maintainers:
    - rxm7706
